# Weekly dependency updates, one grouped pull request per ecosystem. The workflow pins every action by commit SHA
# with its tag in a comment; Dependabot keeps that form when it bumps them (test/ci.test.ts checks it).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
